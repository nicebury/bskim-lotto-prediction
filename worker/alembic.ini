# Alembic 설정 — worker 가 유일한 소유자다.
# 다른 세션(backend/frontend)은 마이그레이션을 만들지 않는다.
#
# sqlalchemy.url 을 여기 두지 않는다. 접속정보는 worker/worker/config.py 가
# .env_worker 에서 읽어 migrations/env.py 에서 주입한다. ini 에 적으면
# app_writer 비밀번호가 git 에 커밋된다.
#
# 계약: docs/wiki/10-contracts/db-schema.md

[alembic]
script_location = migrations
prepend_sys_path = .

# 리비전 파일명에 날짜를 붙여 적용 순서를 파일 목록만 보고 알 수 있게 한다.
file_template = %%(rev)s_%%(slug)s

# 워커는 KST 기준으로 동작한다.
timezone = Asia/Seoul


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
